name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build & test on an iOS Simulator.
  # CoreNFC is an iOS-only framework, so a macOS destination won't compile.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macos-15 runners ship Xcode 16.x but with a versioned path like
      # Xcode_16.2.app — pick whichever 16.x is present rather than
      # hard-coding the minor version.
      - name: Select Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      # Use swift package resolve rather than xcodebuild -resolvePackageDependencies;
      # the latter requires a .xcodeproj which a pure SPM package doesn't have.
      - name: Resolve dependencies
        run: swift package resolve

      # A single xcodebuild test call builds + tests in one step.
      # Omit OS= so xcodebuild picks the installed simulator runtime automatically.
      - name: Run tests
        run: |
          xcodebuild test \
            -scheme JKDesFireReader \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -configuration Debug \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Validate Package.swift is well-formed (no Xcode / simulator needed).
  # ─────────────────────────────────────────────────────────────────────────────
  package-lint:
    name: Validate Package.swift
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump Package.swift
        run: swift package dump-package

      - name: Show package description
        run: swift package describe
