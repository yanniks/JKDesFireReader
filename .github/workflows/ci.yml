name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build & test on an iOS Simulator.
  # CoreNFC is an iOS-only framework, so a macOS destination won't compile.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macos-26 runners ship Xcode 26.x but with a versioned path like
      # Xcode_26.0.app — pick whichever 26.x is present rather than
      # hard-coding the minor version.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      # Emit the xcodebuild-visible schemes and the first few available iPhone
      # simulators so failures are immediately diagnosable in the log.
      - name: Show environment
        run: |
          echo "=== Xcodebuild schemes ==="
          xcodebuild -list 2>&1 || true
          echo "=== Available iPhone simulators ==="
          xcrun simctl list devices available | grep -i iphone | head -20

      - name: Resolve dependencies
        run: swift package resolve

      # Dynamically select the first available iPhone simulator so the job
      # isn't coupled to a specific model name that may differ per runner.
      - name: Run tests
        run: |
          UDID=$(
            xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime and 'com.apple.CoreSimulator.SimRuntime.iOS' not in runtime:
                  continue
              for d in devices:
                  if 'iPhone' in d['name'] and d.get('isAvailable', False):
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
            "
          )
          echo "Using simulator UDID: $UDID"
          xcodebuild test \
            -scheme JKDesFireReader \
            -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Validate Package.swift is well-formed (no Xcode / simulator needed).
  # ─────────────────────────────────────────────────────────────────────────────
  package-lint:
    name: Validate Package.swift
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump Package.swift
        run: swift package dump-package

      - name: Show package description
        run: swift package describe
