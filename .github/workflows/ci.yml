name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build & test with Swift Package Manager on macOS
  # We use an iOS destination so that CoreNFC availability is satisfied.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # Xcode 16 ships Swift 5.10 + Swift Testing support
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme JKDesFireReader \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            || swift package resolve

      - name: Build (release)
        run: |
          xcodebuild build \
            -scheme JKDesFireReader \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme JKDesFireReader \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -configuration Debug \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Validate Package.swift is well-formed (no Xcode needed)
  # ─────────────────────────────────────────────────────────────────────────────
  package-lint:
    name: Validate Package.swift
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump Package.swift
        run: swift package dump-package

      - name: Show package description
        run: swift package describe
